name: Tauhid Ads Lab - Daily Automated Social Media Poster

# ==============================================================================
# AUTOMATIC POSTING IS TEMPORARILY PAUSED
# Waiting for user custom topics. Only manual trigger (workflow_dispatch) is active.
# ==============================================================================
on:
  # push:
  #   branches:
  #     - master
  #     - main
  # schedule:
  #   # Runs 4 times a day (BST 9 AM, 1 PM, 5 PM, 9 PM):
  #   - cron: '0 3,7,11,15 * * *'
  
  # Allows you to run this workflow manually anytime for testing
  workflow_dispatch:

jobs:
  post-to-social-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts (for Pillow graphics)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Graphic and Publish to Social Media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAND_NAME: ${{ secrets.BRAND_NAME || 'Tauhid Ads Lab' }}
          BRAND_PHONE: ${{ secrets.BRAND_PHONE || '+8801624608468' }}
          BRAND_WEBSITE: ${{ secrets.BRAND_WEBSITE || 'http://tauhidadslab.com/' }}
          BRAND_CALENDLY: ${{ secrets.BRAND_CALENDLY || 'https://calendly.com/tauhidadslab/30min' }}
          BRAND_HANDLE: ${{ secrets.BRAND_HANDLE || '@tauhidadslab' }}
          NICHE_TOPIC: ${{ secrets.NICHE_TOPIC || 'Facebook Ads, Google Ads, E-commerce Scaling, Lead Generation' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python main.py
