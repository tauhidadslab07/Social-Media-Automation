
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Golden Orange Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Electric Royal Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Dark Theme Circular Avatar Base -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Neon Ring (Guides circular crop) -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="16 10" opacity="0.4" />
  <circle cx="500" cy="500" r="430" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" filter="url(#glow)" />

  <!-- Subtle Geometric Tech Hexagon Backdrop -->
  <polygon points="500,160 780,320 780,680 500,840 220,680 220,320" fill="#1e293b" opacity="0.4" stroke="#334155" stroke-width="3" />

  <!-- Central Emblem: Dynamic Letter 'T' + Ascending Growth Arrow (Performance Ads) -->
  <g transform="translate(500, 420)">
    <!-- Top Horizontal Bar of 'T' (Divided with dynamic angle) -->
    <path d="M-190,-120 L130,-120 L160,-50 L-160,-50 Z" fill="url(#blueGrad)" />
    
    <!-- Top Right Golden Accent (Growth Arrow Tip) -->
    <path d="M140,-120 L210,-120 L210,-50 Z" fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- Vertical Stem of 'T' morphing into an upward-trending chart / lightning bar -->
    <path d="M-35,-40 L35,-40 L35,160 L-35,160 Z" fill="url(#blueGrad)" />

    <!-- Dynamic Ascending Arrow slicing through -->
    <path d="M-110,130 L-20,40 L35,90 L140,-20" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Arrowhead -->
    <polygon points="140,-45 155,5 95,-10" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography (Perfect for Instagram Circle View) -->
  <text x="500" y="690" font-family="'Segoe UI', Montserrat, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">
    TAUHID
  </text>
  
  <text x="500" y="755" font-family="'Segoe UI', Montserrat, sans-serif" font-size="34" font-weight="800" fill="url(#goldGrad)" letter-spacing="14" text-anchor="middle">
    ADS LAB
  </text>

  <!-- Tagline Badge -->
  <g transform="translate(500, 810)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#1e3a8a" opacity="0.8" />
    <text x="0" y="7" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#93c5fd" letter-spacing="4" text-anchor="middle">
      PERFORMANCE MARKETING
    </text>
  </g>
</svg>
