
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="primaryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1000" height="1000" fill="url(#bgGrad2)" />

  <!-- Circular Ring Accent with modern break -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#primaryGold)" stroke-width="10" stroke-dasharray="240 40 500 40" filter="url(#softGlow)" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Monogram Emblem: Geometric "TAL" -->
  <g transform="translate(500, 430)">
    <!-- Main Center Icon Box -->
    <rect x="-180" y="-180" width="360" height="360" rx="60" fill="#1e293b" stroke="#334155" stroke-width="4" opacity="0.6" />
    
    <!-- Bold Stylized T -->
    <path d="M-120,-110 L120,-110 L120,-60 L30,-60 L30,110 L-30,110 L-30,-60 L-120,-60 Z" fill="#ffffff" />
    
    <!-- Interlocking Gold Accent Shape (representing Ads target/scaling) -->
    <polygon points="30,-110 120,-110 80,-30 30,-30" fill="url(#primaryGold)" filter="url(#softGlow)" />
    
    <!-- Mini Rocket / Growth Icon -->
    <circle cx="80" cy="60" r="22" fill="url(#neonBlue)" />
    <path d="M70,60 L80,48 L90,60 Z" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="500" y="700" font-family="'Segoe UI', Montserrat, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">
    TAUHID
  </text>
  
  <text x="500" y="765" font-family="'Segoe UI', Montserrat, sans-serif" font-size="32" font-weight="800" fill="url(#primaryGold)" letter-spacing="16" text-anchor="middle">
    ADS LAB
  </text>

  <!-- Bottom Subtitle / Phone Pill -->
  <g transform="translate(500, 825)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#1e293b" stroke="url(#primaryGold)" stroke-width="2" />
    <text x="0" y="7" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">
      📞 +8801624608468
    </text>
  </g>
</svg>
